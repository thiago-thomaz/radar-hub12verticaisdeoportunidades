# ==============================================================================
# RADAR_HUB - VIRTUAL HOST & PROXY REVERSO SEGURO
# ==============================================================================

upstream radar_backend {
    server radar_app:3000;
    keepalive 32;
}

upstream grafana_backend {
    server grafana:3000;
    keepalive 16;
}

upstream n8n_backend {
    server n8n:5678;
    keepalive 16;
}

upstream prometheus_backend {
    server prometheus:9090;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost radarhub.local _;

    # Tamanho máximo de payload para uploads e webhooks
    client_max_body_size 20M;

    # ========================================================================
    # Headers de Segurança Modernos (Hardening OWASP)
    # ========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' ws: wss: http: https:;" always;

    # ========================================================================
    # 1. Rotação e Proxy de WebSockets Bidirecionais em Tempo Real (/ws)
    # ========================================================================
    location /ws {
        proxy_pass http://radar_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ========================================================================
    # 2. Endpoints Sensíveis com Rate Limiting Rigoroso
    # ========================================================================
    location ~* ^/api/checkout {
        limit_req zone=checkout_limit burst=5 nodelay;
        proxy_pass http://radar_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* ^/api/auth {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://radar_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_general_limit burst=20 nodelay;
        proxy_pass http://radar_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================================================
    # 3. Exportador de Métricas do Prometheus
    # ========================================================================
    location /metrics {
        proxy_pass http://radar_backend/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ========================================================================
    # 4. Cockpit Web Dashboard & Frontend Estático
    # ========================================================================
    location / {
        proxy_pass http://radar_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================================================
    # 5. Roteamento de Ferramentas de Observabilidade
    # ========================================================================
    location /grafana/ {
        proxy_pass http://grafana_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
