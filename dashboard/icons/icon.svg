<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8"/>
  
  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#38ef7d" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#ff007f" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Central Glowing Lightning Bolt -->
  <path d="M280 80 L160 270 L240 270 L200 432 L360 230 L270 230 Z" fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>
